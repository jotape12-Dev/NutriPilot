name: NutriPilot
options:
  bundleIdPrefix: com.jotape
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.9"
  GENERATE_INFOPLIST_FILE: YES
  PRODUCT_BUNDLE_IDENTIFIER: com.jotape.NutriPilot
  # Obrigatórios para instalar no dispositivo; app e extensão precisam ter a mesma versão.
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  NutriPilot:
    type: application
    platform: iOS
    sources:
      - Sources/NutriPilotCore
      - Sources/NutriPilotApp
      - App
    dependencies:
      - target: NutriPilotWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jotape.NutriPilot
      DEVELOPMENT_TEAM: 6F2KGULZ85
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "O NutriPilot utiliza o microfone para transcrição rápida por voz das suas refeições."
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "O NutriPilot analisa o áudio para identificar alimentos e porções da TBCA."
      INFOPLIST_KEY_NSSupportsLiveActivities: YES

  NutriPilotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/NutriPilotWidgets
      - Sources/NutriPilotCore
    # NSExtension é um dicionário: INFOPLIST_KEY_* não o gera, então o Info.plist precisa ser um arquivo real.
    info:
      path: Sources/NutriPilotWidgets/Info.plist
      properties:
        CFBundleDisplayName: NutriPilot Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jotape.NutriPilot.widgets
      DEVELOPMENT_TEAM: 6F2KGULZ85
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      GENERATE_INFOPLIST_FILE: YES
